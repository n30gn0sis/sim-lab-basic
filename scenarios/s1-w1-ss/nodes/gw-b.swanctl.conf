# gw-b: IKEv2 PSK, policy-based, the responder (start_action = trap)
connections {
    s1 {
        version = 2
        mobike = no
        local_addrs  = 198.18.11.6
        remote_addrs = 198.18.11.2
        proposals = aes256gcm16-prfsha384-ecp384
        rekey_time = 600s
        dpd_delay = 10s
        local  { auth = psk  id = gw-b.site-b.lab }
        remote { auth = psk  id = gw-a.site-a.lab }
        children {
            s1-net {
                local_ts  = 10.211.2.0/24
                remote_ts = 10.211.1.0/24
                esp_proposals = aes256gcm16-ecp384
                rekey_time = 120s
                dpd_action = restart
                start_action = trap
            }
        }
    }
}
secrets {
    ike-s1 {
        id-a = gw-a.site-a.lab
        id-b = gw-b.site-b.lab
        secret = "lab-scenario-s1-w1-ss"
    }
}
