name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats
      - name: Run the gate
        run: ./tests/run.sh
