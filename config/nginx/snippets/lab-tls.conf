# Included by every .lab vhost. One certificate, three SANs, issued by the
# internal easy-rsa CA that r770-portal-deploy.sh generates ON the gapped box
# (scripts/r770-portal-deploy.sh ca): CA material is never carried in.
ssl_certificate     /etc/nginx/ssl/lab.crt;
ssl_certificate_key /etc/nginx/ssl/lab.key;
ssl_protocols       TLSv1.2 TLSv1.3;
